[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "full-history-agent"
version = "1.1.0"
description = "Autonomous MAGMA HTTP agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-2-Clause"}
dependencies = [
    "magma_core[interface]>=2.0.0b1,<3.0.0",
    "torch",
    "transformers==5.17.0",
    "kernels==0.16.2",
    "accelerate==1.15.0",
    "bitsandbytes==0.50.2",
    "fastapi",
    "uvicorn",
    "pydantic>=2.4,<3",
    "openai-harmony==0.0.8",
    "protobuf"
]

[project.scripts]
full-history-agent = "full_history_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.entry-points."magma.export.gen"]
full-history-agent = "full_history_agent.export.service:Exporter"

[project.entry-points."magma.export.offpolicy"]
full-history-agent = "full_history_agent.export.offpolicy.format:HRAgentFormat"

[project.optional-dependencies]
offpolicy = ["magma-offpolicy-gen>=0.1.0"]
